<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual Reports — fuutu-stack</title><style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0}
