<svg viewBox="0 0 1200 780" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fuutu Stack — enterprise features, autonomous AI workflow, agent harness, and tech stack">
  <title>Fuutu Stack — enterprise features, autonomous AI workflow, and tech stack</title>

  <!-- Background: near-black -->
  <rect width="1200" height="780" rx="12" fill="#08090A"/>

  <!-- Subtle border: almost invisible -->
  <rect x="1" y="1" width="1198" height="778" rx="11" fill="none" stroke="#1F1F23" stroke-width="1"/>

