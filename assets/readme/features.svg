    <text x="530" y="237" font-size="12" font-weight="400" fill="#8A8F98">Signed delivery, retry,</text>
    <text x="530" y="253" font-size="12" font-weight="400" fill="#8A8F98">scheduled jobs, idempotent</text>

    <rect x="735" y="190" width="210" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="755" y="217" font-size="15" font-weight="700" fill="#F7F8F8">i18n + Notifications</text>
    <text x="755" y="237" font-size="12" font-weight="400" fill="#8A8F98">en/de, next-intl,</text>
    <text x="755" y="253" font-size="12" font-weight="400" fill="#8A8F98">in-app, multi-channel</text>

    <rect x="960" y="190" width="180" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="980" y="217" font-size="15" font-weight="700" fill="#F7F8F8">Telemetry</text>
    <text x="980" y="237" font-size="12" font-weight="400" fill="#8A8F98">Built-in, non-blocking,</text>
    <text x="980" y="253" font-size="12" font-weight="400" fill="#8A8F98">license-compliance ready</text>
