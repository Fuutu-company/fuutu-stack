  <!-- Section header: muted, not colored -->
  <text x="60" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#6B6F76" letter-spacing="2">
    ENTERPRISE FEATURES — NOT BOLT-ONS, BUILT IN
  </text>
  <text x="60" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#F7F8F8">
    Everything a production SaaS needs. No glue code, no config hell, no surprises.
  </text>

  <!-- Row 1 -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="60" y="95" width="210" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="80" y="122" font-size="15" font-weight="700" fill="#F7F8F8">Audit Logs</text>
    <text x="80" y="142" font-size="12" font-weight="400" fill="#8A8F98">Immutable, paginated,</text>
    <text x="80" y="158" font-size="12" font-weight="400" fill="#8A8F98">org-scoped, auto-retention</text>

    <rect x="285" y="95" width="210" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="305" y="122" font-size="15" font-weight="700" fill="#F7F8F8">Organizations</text>
    <text x="305" y="142" font-size="12" font-weight="400" fill="#8A8F98">Multi-tenant, members,</text>
    <text x="305" y="158" font-size="12" font-weight="400" fill="#8A8F98">invitations, seat syncing</text>

    <rect x="510" y="95" width="210" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="530" y="122" font-size="15" font-weight="700" fill="#F7F8F8">RBAC + Admin</text>
    <text x="530" y="142" font-size="12" font-weight="400" fill="#8A8F98">Granular permissions,</text>
    <text x="530" y="158" font-size="12" font-weight="400" fill="#8A8F98">ban, admin panel built in</text>

    <rect x="735" y="95" width="210" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="755" y="122" font-size="15" font-weight="700" fill="#F7F8F8">2FA + Passkeys</text>
    <text x="755" y="142" font-size="12" font-weight="400" fill="#8A8F98">OAuth, magic-link,</text>
    <text x="755" y="158" font-size="12" font-weight="400" fill="#8A8F98">invitation-only signup</text>

    <rect x="960" y="95" width="180" height="80" rx="8" fill="#0E0E11" stroke="#1F1F23" stroke-width="1"/>
    <text x="980" y="122" font-size="15" font-weight="700" fill="#F7F8F8">Rate Limiting</text>
    <text x="980" y="142" font-size="12" font-weight="400" fill="#8A8F98">Per-endpoint, CSP,</text>
    <text x="980" y="158" font-size="12" font-weight="400" fill="#8A8F98">HSTS, redirect guard</text>
