# Desktop shell (Tauri 2). This crate is the app; `crates/*` is room for your
# product crates (add them to `members` and depend on them from here).
# The Rust toolchain is only needed when `config.features.desktop` is on.
[workspace]
members = [".", "crates/*", "vendor/*"]
resolver = "2"

[package]
name = "desktop-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "LicenseRef-Fuutu-Business-License"

[lib]
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Agent automation bridge (MCP) — debug builds only. `pnpm dev:desktop`
# enables it; the code is additionally behind `cfg(debug_assertions)`, so a
# release build never contains it even with the feature on.
devtools = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-window-state = "=2.5.0"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-mcp-bridge = { path = "vendor/tauri-plugin-mcp-bridge", optional = true }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
