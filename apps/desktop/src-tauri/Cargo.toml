# Desktop shell (Tauri 2). This crate is the app. Your dependencies and code
# go into the app-owned `app-ext` crate (`app-ext/Cargo.toml`), more product
# crates under `crates/*` — never into this file.
# The Rust toolchain is only needed when `config.features.desktop` is on.
[workspace]
members = [".", "app-ext", "crates/*", "vendor/*"]
resolver = "2"

[package]
name = "desktop-app"
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
publish = false
license = "LicenseRef-Fuutu-Business-License"

[lib]
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Agent automation bridge (MCP) — debug builds only. `pnpm dev:desktop`
# enables it; the code is additionally behind `cfg(debug_assertions)`, so a
# release build never contains it even with the feature on.
devtools = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-process = "=2.4.0"
tauri-plugin-deep-link = "=2.6.3"
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = { version = "=2.5.5", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
log = "0.4.35"
# Sign-in (src/auth): HTTP with rustls + ring (same stack as the updater
# plugin), PKCE, OS keychain, offline-claim verification (EdDSA).
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
keyring = "=4.2.0"
rand = "=0.10.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "form", "http2", "charset", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "=0.11.1"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-mcp-bridge = { path = "vendor/tauri-plugin-mcp-bridge", optional = true }
# Your dependencies and code (app-owned app-ext/Cargo.toml).
app-ext = { path = "app-ext" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
