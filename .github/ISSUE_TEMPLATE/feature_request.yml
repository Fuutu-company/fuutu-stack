name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like and why.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What are you trying to do that's currently hard or impossible?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - API / Backend
        - Database
        - Frontend / UI
        - Provider (Mail/Payments/Storage/AI)
        - AI / MCP
        - Infrastructure
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Willing to contribute?
      options:
        - label: I am willing to submit a PR for this feature
          required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, links, or anything else relevant.
    validations:
      required: false
