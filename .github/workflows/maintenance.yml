name: Maintenance
run-name: ${{ vars.FUUTU_CI_ENABLED == 'true' && 'Maintenance' || 'Maintenance disabled — set FUUTU_CI_ENABLED=true' }}

# Weekly maintenance: dependency + security audit report → job summary (replaces the old per-PR
# audit job and Dependabot; updates are batched consciously from this report).
# Pruning of closed-PR visual reports lives in pages.yml.
# Disabled until FUUTU_CI_ENABLED=true; no job requests a runner while off — see ci.yml.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: vars.FUUTU_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
        with:
          db-generate: "false"
      - name: Write dependency report to job summary
        run: node tooling/scripts/dependency-report.mjs >> "$GITHUB_STEP_SUMMARY"
      # Report only: advisories are triaged with the weekly update batch.
      - name: Write security audit to job summary
        run: |
          {
            echo "## Security audit (production dependencies, high and above)"
            echo ""
            echo '```'
            pnpm audit --prod --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
