name: CI
run-name: ${{ vars.FUUTU_CI_ENABLED == 'true' && 'CI' || 'CI disabled — set FUUTU_CI_ENABLED=true to enable' }}

# Kit CI — disabled by default. Enabled repos set the repository variable
# FUUTU_CI_ENABLED=true (Settings → Secrets and variables → Actions →
# Variables). Clones get a silent pipeline until they opt in.

on:
  push:
    branches: [main, develop]
  pull_request:
  # Also dispatched by the e2e job after a baseline commit on a PR branch —
  # GITHUB_TOKEN pushes fire no events, so the dispatched run gives required
  # checks a conclusion on the bot commit (png-only diff → code=false → skip).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  FUUTU_TELEMETRY_DISABLED: "1"

jobs:
  # Runs only while CI is disabled — kit clones see why nothing ran and how
  # to opt in, right in the run summary. Skipped (by design) once enabled.
  enable-ci:
    name: ℹ️ CI disabled — how to enable
    runs-on: ubuntu-latest
    if: vars.FUUTU_CI_ENABLED != 'true'
    steps:
      - run: |
          {
            echo "## Fuutu Stack CI is disabled"
            echo ""
            echo "This kit ships with the pipeline turned **off by default**, so cloned repos don't get surprise CI runs. Every job in this run was skipped on purpose — this is not an error."
            echo ""
            echo "**To enable CI on this repository:**"
            echo "1. Go to **Settings → Secrets and variables → Actions → Variables**"
            echo "2. Create the repository variable \`FUUTU_CI_ENABLED\` with value \`true\`"
            echo "3. Re-run this workflow or push a new commit"
            echo ""
            echo "See CONTRIBUTING.md → \"Enabling CI\"."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Fuutu Stack CI is disabled — set repository variable FUUTU_CI_ENABLED=true to activate it (see run summary)."

  changes:
    runs-on: ubuntu-latest
    if: vars.FUUTU_CI_ENABLED == 'true'
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Filter changed files
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            git fetch origin "$BASE" --depth=1
            DIFF=$(git diff --name-only "origin/$BASE" HEAD)
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            DIFF=$(git diff --name-only "$BEFORE" HEAD)
          fi
          if echo "$DIFF" | grep -qvE '\.(md|png|jpe?g|svg|webp|gif|ico|mp4|woff2?|ttf)$|(^|/)(README|CHANGELOG|LICENSE)(\.md)?$'; then
            echo "code=true" >> $GITHUB_OUTPUT
          else
            echo "code=false" >> $GITHUB_OUTPUT
          fi

  # Lint + types + translations + unit/integration tests — one install.
  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true' && vars.FUUTU_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fuutu-stack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/fuutu-stack
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Create .env for dotenv-cli
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:password@localhost:5432/fuutu-stack
          BETTER_AUTH_URL=http://localhost:3000
          EOF
          # Throwaway per-run secret — never commit a real auth secret to CI.
          echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
      # `migrate deploy`, not `db:push` — integration tests exercise raw-SQL
      # migrations that `prisma db push` does not apply.
      - name: Apply DB migrations
        run: pnpm -F @fuutu/db exec prisma migrate deploy
      - run: pnpm check:ci
      - run: pnpm check-types
      - run: pnpm check-translations
      - run: pnpm test
      - run: pnpm -F @fuutu/db test:integration

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && vars.FUUTU_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/fuutu-stack
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      NEXT_PUBLIC_ANALYTICS_PROVIDER: noop
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Generate CI auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build

  # E2E + visual regression for both apps — one definition, matrix-per-app.
  # The Playwright image ships browsers AND system deps: no install step,
  # no cache, no apt. Baselines are committed PNGs in
  # .fuutu/visual-baselines/<app>/ — they travel with the code, so every PR
  # compares against the exact baselines of its branch.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true' && vars.FUUTU_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write       # baseline auto-commit pushes to the branch
      actions: write        # dispatch follow-up run for required checks
      pull-requests: write  # slim visual-result comment
    # Must match the pinned catalog @playwright/test version exactly — bump both together.
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fuutu-stack
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        # No ports mapping — container jobs share a Docker network where the
        # service is reachable at hostname `postgres` on every port.
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: saas
            db: true
          - app: marketing
            db: false
    env:
      # SWC materializes its native binding into a cache dir and validates
      # parent permissions — /github/home fails that check inside containers.
      SWC_NATIVE_BINDING_CACHE: /tmp/swc-binding-cache
      # Container jobs reach services via their service name, not localhost.
      DATABASE_URL: postgresql://postgres:password@postgres:5432/fuutu-stack
      BETTER_AUTH_URL: http://localhost:3000
      EMAIL_PROVIDER: console
      NEXT_PUBLIC_ANALYTICS_PROVIDER: noop
    steps:
      - name: Generate CI auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          # PRs check out the branch tip — baseline commits must be pushable
          # back onto the PR branch; full history for the rebase-retry.
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create .env for dotenv-cli
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:password@postgres:5432/fuutu-stack
          BETTER_AUTH_URL=http://localhost:3000
          EMAIL_PROVIDER=console
          NEXT_PUBLIC_ANALYTICS_PROVIDER=noop
          FUUTU_TELEMETRY_DISABLED=1
          EOF
          if [ "${{ matrix.db }}" = "true" ]; then
            echo "FUUTU_DISABLE_RATE_LIMIT=1" >> .env
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> .env
          fi
      - name: Prepare database
        if: matrix.db
        run: |
          pnpm db:push
          NODE_ENV=development pnpm db:seed
      - name: Build ${{ matrix.app }}
        run: pnpm -F @fuutu/${{ matrix.app }} build
      - name: Run non-visual tests (must pass, chromium only)
        run: pnpm -F @fuutu/${{ matrix.app }} exec playwright test --grep-invert "visual regression" --project=chromium
        env:
          PLAYWRIGHT_USE_PROD: "1"

      # --update-snapshots "passes" on pixel diffs — the diff signal is the
      # git diff afterwards. A real failure aborts before the status check.
      - name: Run visual tests + refresh baselines (PR)
        id: visual
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pnpm -F @fuutu/${{ matrix.app }} exec playwright test tests/visual.spec.ts --update-snapshots --project=chromium --project=mobile-safari
          if [ -n "$(git status --porcelain -- .fuutu/visual-baselines/${{ matrix.app }})" ]; then
            echo "changed=1" >> $GITHUB_OUTPUT
          fi
        env:
          PLAYWRIGHT_USE_PROD: "1"

      # Must run before the baseline commit — git status vs HEAD is the diff
      # signal, and the commit would erase it.
      - name: Generate visual report
        if: github.event_name == 'pull_request'
        run: node tooling/scripts/visual-report.mjs --app "${{ matrix.app }}"
        env:
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}

      - name: Commit updated baselines to PR branch
        id: baseline-pr
        if: github.event_name == 'pull_request' && steps.visual.outputs.changed == '1'
        run: tooling/scripts/ci-visual-baselines.sh "${{ matrix.app }}" "${{ github.head_ref }}" pr

      # GITHUB_TOKEN pushes fire no events → dispatch a run so required checks
      # get a conclusion on the baseline commit (png-only diff → all skip).
      - name: Re-dispatch CI for the baseline commit
        if: steps.baseline-pr.outputs.pushed == '1'
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo,
              workflow_id: "ci.yml",
              ref: "${{ github.head_ref }}",
            });

      - name: Update baselines (merge to develop — chromium + mobile-safari only)
        if: github.event_name == 'push' && github.ref_name == 'develop'
        run: pnpm -F @fuutu/${{ matrix.app }} exec playwright test tests/visual.spec.ts --update-snapshots --project=chromium --project=mobile-safari
        env:
          PLAYWRIGHT_USE_PROD: "1"

      - name: Update baselines (merge to main — all browsers)
        if: github.event_name == 'push' && github.ref_name == 'main'
        run: pnpm -F @fuutu/${{ matrix.app }} exec playwright test tests/visual.spec.ts --update-snapshots
        env:
          PLAYWRIGHT_USE_PROD: "1"

      # Same report on push — placed after the update steps above so the
      # regenerated baselines are what gets diffed.
      - name: Generate visual report
        if: github.event_name == 'push'
        run: node tooling/scripts/visual-report.mjs --app "${{ matrix.app }}"

      - name: Commit updated baselines (push)
        if: github.event_name == 'push'
        run: tooling/scripts/ci-visual-baselines.sh "${{ matrix.app }}" "${{ github.ref_name }}" push

      # Hosted report: pr-<N>/<app>/ on PRs, <branch>/<app>/ on pushes. Opt-in
      # via FUUTU_PAGES_ENABLED; requires Pages → deploy from branch gh-pages.
      - name: Deploy visual report to GitHub Pages
        if: vars.FUUTU_PAGES_ENABLED == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/${{ matrix.app }}/visual-report
          destination_dir: ${{ github.event_name == 'pull_request' && format('pr-{0}/{1}', github.event.pull_request.number, matrix.app) || format('{0}/{1}', github.ref_name, matrix.app) }}
          keep_files: true

      # Regenerate the gh-pages index tree (root listing + per-dir landing
      # pages) so the reports are navigable from the Pages root. Same gate
      # as the deploy; a rejected push (fork PR) warns — the next deploy
      # regenerates the index.
      - name: Update gh-pages index
        if: vars.FUUTU_PAGES_ENABLED == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_WORKSPACE"
          wt=/tmp/gh-pages
          cd "$repo"
          git worktree remove --force "$wt" 2>/dev/null || true
          if ! git fetch origin gh-pages; then
            echo "::warning::gh-pages branch not found — skipping index update"
            exit 0
          fi
          git worktree add --detach "$wt" origin/gh-pages
          node tooling/scripts/visual-pages-index.mjs "$wt"
          cd "$wt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "index unchanged — nothing to commit"
          else
            git commit -m "chore(pages): update visual-report index [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              git fetch origin gh-pages
              git rebase --abort 2>/dev/null || true
              if git rebase origin/gh-pages && git push origin "HEAD:gh-pages"; then
                pushed=1
                break
              fi
            done
            if [ "$pushed" != "1" ]; then
              echo "::warning::Could not push gh-pages index update after 3 attempts (fork PR?). It regenerates on the next deploy."
            fi
          fi
          cd "$repo"
          git worktree remove --force "$wt" 2>/dev/null || true

      - name: Comment on visual result (PR)
        if: github.event_name == 'pull_request' && (steps.visual.outputs.changed == '1' || steps.visual.outcome == 'failure')
        uses: actions/github-script@v8
        with:
          script: |
            const changed = "${{ steps.visual.outputs.changed }}" === "1";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pagesEnabled = "${{ vars.FUUTU_PAGES_ENABLED }}" === "true";
            // If Pages uses a custom domain, adjust this base URL.
            const pagesBase = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}`;
            const reportsLine = pagesEnabled
              ? `📊 [SaaS report](${pagesBase}/saas/) · [Marketing report](${pagesBase}/marketing/) · 📦 [Artifacts](${runUrl})`
              : `📦 [Run + report artifacts](${runUrl})`;
            const body = changed
              ? [
                  "## ⚠️ Visual Changes — ${{ matrix.app }}",
                  "",
                  "Updated baseline screenshots were committed to this branch. Review the PNG diffs under `.fuutu/visual-baselines/${{ matrix.app }}/` in \"Files changed\".",
                  reportsLine,
                  "",
                  "> Intentional → merge. Unintentional → fix the code and push; baselines regenerate.",
                ].join("\n")
              : [
                  "## ⚠️ Visual Regression Did Not Complete — ${{ matrix.app }}",
                  "",
                  `Visual tests failed before baselines could update. Check the [run](${runUrl}).`,
                ].join("\n");
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ matrix.app }}-report
          path: |
            apps/${{ matrix.app }}/playwright-report
            apps/${{ matrix.app }}/test-results
            apps/${{ matrix.app }}/visual-report
          if-no-files-found: ignore
          retention-days: 14
