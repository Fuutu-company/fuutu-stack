name: Desktop

# Desktop app (apps/desktop) — checks on pull requests, signed release
# bundles + publish on app release tags (`vX.Y.Z`) or by hand.
#
# Inert while `config.features.desktop` is false (packages/config/index.ts):
# the `gate` job reads the switch and every other job is skipped.
#
# Secrets — store them on the protected `desktop-release` environment
# (Settings → Environments), not as repository secrets; see
# apps/desktop/RELEASING.md for how to create each one:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  updater signing
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                         macOS sign + notarise
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD               Windows Authenticode (.pfx, base64)
#   S3_ENDPOINT, S3_REGION, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY  releases bucket
# Variables:
#   NEXT_PUBLIC_SAAS_URL, DESKTOP_UPDATER_PUBLIC_KEY, S3_BUCKET_DESKTOP_RELEASES,
#   S3_FORCE_PATH_STYLE, DESKTOP_PUBLIC_BASE (static update source only)
#
# Every action is pinned by commit SHA (first-party included) — bump the SHA
# and its `# vX` comment together.
#
# Signing secrets go to the Build step only, and `pnpm build:desktop`
# (scripts/run.ts) hands them to `tauri build` alone — never to the build
# telemetry ping, `next build` or the licence scripts.
#
# Build telemetry stays on (LICENSE.md §7): `pnpm build:desktop` sends one
# ping per build with surface "desktop". Never set FUUTU_TELEMETRY_DISABLED here.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/desktop/**"
      - ".github/workflows/desktop.yml"
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, beta]
        default: stable
      publish:
        description: Upload to the releases bucket
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.switch.outputs.enabled }}
      linux_runner: ${{ steps.app.outputs.linux_runner }}
      linux_packages: ${{ steps.app.outputs.linux_packages }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
      - id: switch
        run: |
          enabled=$(node --input-type=module -e "
            import { isDesktopEnabled } from './tooling/scripts/desktop.mjs';
            console.log(await isDesktopEnabled(process.cwd()));")
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "::notice::Desktop app is off (config.features.desktop = false) — nothing to do."
          fi
      # Linux runner and extra apt packages from the app-owned
      # apps/desktop/scripts/lib/app-ci.mjs (validated there).
      - id: app
        if: steps.switch.outputs.enabled == 'true'
        run: node apps/desktop/scripts/ci-inputs.mjs >> "$GITHUB_OUTPUT"

  rust:
    name: Rust checks
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ${{ needs.gate.outputs.linux_runner }}
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Linux webview deps
        env:
          LINUX_APT_PACKAGES: ${{ needs.gate.outputs.linux_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf $LINUX_APT_PACKAGES
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: cargo-deny
      # Licences, bans, sources, advisories — rules in deny.toml plus the
      # app's exceptions (deny.app.toml).
      - run: node ../scripts/cargo-deny.mjs
      # The agent automation bridge never reaches a release build.
      - run: node ../scripts/check-release-clean.mjs

  build:
    name: Build ${{ matrix.job }}
    needs: [gate, rust]
    if: needs.gate.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
            bundle: target/universal-apple-darwin/release/bundle
            binary: target/universal-apple-darwin/release/desktop-app
          - job: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --bundles nsis
            bundle: target/release/bundle
            binary: target/release/desktop-app.exe
          - job: linux-x86_64
            os: ${{ needs.gate.outputs.linux_runner }}
            target: x86_64-unknown-linux-gnu
            # Bundles from desktopConfig.release.linuxFormats (scripts/run.ts).
            args: ""
            bundle: target/release/bundle
            binary: target/release/desktop-app
    runs-on: ${{ matrix.os }}
    # Releases sign inside the protected environment (required reviewers,
    # deployment rules for `v*` tags / main — RELEASING.md); pull requests
    # run without one and get no secrets.
    environment: ${{ github.event_name != 'pull_request' && 'desktop-release' || '' }}
    env:
      # Pull requests build unsigned (no secrets on forks); releases sign.
      RELEASE: ${{ github.event_name != 'pull_request' }}
      NEXT_PUBLIC_SAAS_URL: ${{ vars.NEXT_PUBLIC_SAAS_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Toolchain inlined from .github/actions/setup so every action here is
      # pinned by commit SHA (pnpm version from package.json#packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.job == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux webview deps
        if: runner.os == 'Linux'
        env:
          LINUX_APT_PACKAGES: ${{ needs.gate.outputs.linux_packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf $LINUX_APT_PACKAGES
      # Your sidecar programs (app-owned scripts/lib/app-sidecars.mjs
      # `build()`); nothing without one. No secrets here.
      - name: Build sidecars
        shell: bash
        working-directory: apps/desktop
        run: node scripts/build-sidecars.mjs "${{ matrix.target }}"
      - name: Import Windows certificate
        if: runner.os == 'Windows' && env.RELEASE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Output "::warning::No WINDOWS_CERTIFICATE — the installer is unsigned."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Build
        env:
          DESKTOP_UPDATER_PUBLIC_KEY: ${{ env.RELEASE == 'true' && vars.DESKTOP_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ env.RELEASE == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.RELEASE == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.RELEASE == 'true' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ env.RELEASE == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ env.RELEASE == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.RELEASE == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: pnpm build:desktop ${{ matrix.args }}
      # The Tauri CLI rewrites the kit Cargo.toml's tauri features from the
      # config; pnpm build:desktop reverts it (scripts/lib/kit-manifest.ts).
      - name: Kit Cargo.toml unchanged
        shell: bash
        run: git diff --exit-code -- apps/desktop/src-tauri/Cargo.toml
      - name: Scan the release binary for the automation bridge
        shell: bash
        working-directory: apps/desktop
        # Cargo package name (src-tauri/Cargo.toml), not the product name.
        run: node scripts/check-release-clean.mjs "src-tauri/${{ matrix.binary }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-${{ matrix.job }}
          path: apps/desktop/src-tauri/${{ matrix.bundle }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [gate, build]
    if: >-
      needs.gate.outputs.enabled == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    environment: desktop-release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Toolchain inlined from .github/actions/setup so every action here is
      # pinned by commit SHA (pnpm version from package.json#packageManager).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*
          path: ${{ runner.temp }}/release
      - name: Name artifact directories after their build job
        shell: bash
        run: |
          cd "$RUNNER_TEMP/release"
          for d in desktop-*; do mv "$d" "${d#desktop-}"; done
      - name: Upload + manifest
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          S3_BUCKET_DESKTOP_RELEASES: ${{ vars.S3_BUCKET_DESKTOP_RELEASES }}
          CHANNEL: ${{ inputs.channel || (contains(github.ref_name, '-') && 'beta' || 'stable') }}
          PUBLIC_BASE: ${{ vars.DESKTOP_PUBLIC_BASE }}
        run: |
          args=(--dir "$RUNNER_TEMP/release" --channel "$CHANNEL")
          if [ -n "$PUBLIC_BASE" ]; then args+=(--public-base "$PUBLIC_BASE"); fi
          pnpm -F @fuutu/desktop-app exec tsx scripts/publish.ts "${args[@]}"
