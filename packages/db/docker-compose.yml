name: fuutu-stack-nextjs

services:
  postgres:
    image: postgres
    container_name: fuutu-stack-nextjs-postgres
    environment:
      POSTGRES_DB: fuutu-stack-nextjs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - fuutu-stack-nextjs_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Local S3-compatible object store for the @fuutu/storage package.
  # Production uses AWS S3 or Cloudflare R2 via the same provider.
  minio:
    image: minio/minio
    container_name: fuutu-stack-nextjs-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console (http://localhost:9001)
    volumes:
      - fuutu-stack-nextjs_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bucket bootstrap. Creates the buckets Fuutu ships with
  # (avatars, organization-logos) so fresh dev clones work out of the box.
  # Idempotent via `mb --ignore-existing`.
  minio-bootstrap:
    image: minio/mc
    container_name: fuutu-stack-nextjs-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/avatars &&
      mc mb --ignore-existing local/organization-logos &&
      echo 'MinIO buckets ready.'
      "
    restart: "no"

volumes:
  fuutu-stack-nextjs_postgres_data:
  fuutu-stack-nextjs_minio_data:
